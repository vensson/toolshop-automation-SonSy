[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: fast checks for every pull request
    regression: full suite
    ui: browser tests
    api: APIRequestContext tests
    github: GitHub REST API tests (rate limited without GITHUB_TOKEN)
    bdd: pytest-bdd scenarios
    flaky_demo: intentionally flaky tests for the flaky clinic (excluded by default)
bdd_features_base_dir = tests/buoi3/features
